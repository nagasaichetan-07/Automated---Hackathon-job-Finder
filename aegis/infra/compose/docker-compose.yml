services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_password}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis_user} -d ${POSTGRES_DB:-aegis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  api:
    build:
      context: ../../
      dockerfile: aegis/infra/docker/Dockerfile.api
    container_name: aegis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aegis_user}:${POSTGRES_PASSWORD:-aegis_password}@postgres:5432/${POSTGRES_DB:-aegis_db}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-aegis_user}:${POSTGRES_PASSWORD:-aegis_password}@postgres:5432/${POSTGRES_DB:-aegis_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aegis-network

  worker:
    build:
      context: ../../
      dockerfile: aegis/infra/docker/Dockerfile.worker
    container_name: aegis-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aegis_user}:${POSTGRES_PASSWORD:-aegis_password}@postgres:5432/${POSTGRES_DB:-aegis_db}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-aegis_user}:${POSTGRES_PASSWORD:-aegis_password}@postgres:5432/${POSTGRES_DB:-aegis_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - aegis-network

  scheduler:
    build:
      context: ../../
      dockerfile: aegis/infra/docker/Dockerfile.worker
    container_name: aegis-scheduler
    restart: unless-stopped
    command: ["celery", "-A", "apps.worker.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - aegis-network

  dashboard:
    build:
      context: ../../
      dockerfile: aegis/infra/docker/Dockerfile.dashboard
    container_name: aegis-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - aegis-network

volumes:
  postgres_data:
  redis_data:

networks:
  aegis-network:
    driver: bridge
